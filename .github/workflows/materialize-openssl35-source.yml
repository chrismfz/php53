name: Materialize OpenSSL 3.5 source fixes

on:
  push:
    paths:
      - .github/workflows/materialize-openssl35-source.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch tracked PHP source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ext/openssl/openssl.c')
          text = path.read_text(encoding='utf-8')

          sslv23_old = '\tREGISTER_LONG_CONSTANT("OPENSSL_SSLV23_PADDING", RSA_SSLV23_PADDING, CONST_CS|CONST_PERSISTENT);'
          sslv23_new = '#ifdef RSA_SSLV23_PADDING\n' + sslv23_old + '\n#endif'
          if sslv23_new not in text:
              count = text.count(sslv23_old)
              if count != 1:
                  raise SystemExit('expected exactly one RSA_SSLV23_PADDING registration, found %d' % count)
              text = text.replace(sslv23_old, sslv23_new, 1)

          oid_old = '\t\tif (OBJ_create(cnf->value, cnf->name, cnf->name) == NID_undef) {'
          oid_new = ('\t\tif (OBJ_sn2nid(cnf->name) == NID_undef && OBJ_ln2nid(cnf->name) == NID_undef &&\n'
                     '\t\t\t\tOBJ_create(cnf->value, cnf->name, cnf->name) == NID_undef) {')
          if oid_new not in text:
              count = text.count(oid_old)
              if count != 1:
                  raise SystemExit('expected exactly one add_oid_section OBJ_create call, found %d' % count)
              text = text.replace(oid_old, oid_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff --exit-code --quiet && { echo 'No source changes produced'; exit 1; }
          git diff -- ext/openssl/openssl.c

      - name: Commit source port
        shell: bash
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add ext/openssl/openssl.c
          test "$(git diff --cached --name-only)" = "ext/openssl/openssl.c"
          git commit -m "Port PHP 5.3 OpenSSL source to OpenSSL 3.5"
          git push origin HEAD:main
