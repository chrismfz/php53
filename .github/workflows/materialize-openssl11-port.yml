name: Materialize OpenSSL 1.1 source port

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-openssl11-port.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compatibility port directly to sources
        shell: bash
        run: |
          set -Eeuo pipefail

          # A repeated run after the cleanup commit is harmless.
          if [[ ! -f tools/apply-openssl11-compat.py || ! -f tools/apply-openssl11-compat-stage2.py ]]; then
            echo "Compatibility transformers already removed; nothing to materialize."
            exit 0
          fi

          python3 tools/apply-openssl11-compat.py "$GITHUB_WORKSPACE"

          # Normalize trailing horizontal whitespace only inside openssl_open().
          # The original PHP 5.3 source has two logically identical cleanup paths
          # with slightly different whitespace, while stage 2 intentionally uses
          # strict source-shape checks.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ext/openssl/openssl.c")
          text = path.read_text(encoding="utf-8")
          marker = "PHP_FUNCTION(openssl_open)"
          start = text.index(marker)
          end = text.index("\n/* }}} */", start)
          block = text[start:end]
          normalized = "\n".join(line.rstrip(" \t") for line in block.split("\n"))
          if normalized == block:
              raise SystemExit("openssl_open normalization made no change")
          path.write_text(text[:start] + normalized + text[end:], encoding="utf-8")
          PY

          python3 tools/apply-openssl11-compat-stage2.py "$GITHUB_WORKSPACE"

          # Development scaffolding is no longer part of the final source tree.
          rm -f \
            build-php53-openssl11-dev.sh \
            tools/apply-openssl11-compat.py \
            tools/apply-openssl11-compat-stage2.py \
            .github/workflows/materialize-openssl11-port.yml

      - name: Commit materialized source port
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Port PHP 5.3 OpenSSL extension to OpenSSL 1.1"
          git push origin HEAD:main
