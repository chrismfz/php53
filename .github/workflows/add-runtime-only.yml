name: Add PHP 5.3 runtime-only builder mode

on:
  push:
    paths:
      - .github/workflows/add-runtime-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-php53.sh')
          t = p.read_text(encoding='utf-8')
          def once(old, new, label):
              global t
              c = t.count(old)
              if c != 1:
                  raise SystemExit('%s: expected one match, found %d' % (label, c))
              t = t.replace(old, new, 1)
          once('# RUN_REGRESSION_TESTS=0 skips the post-build regression suite.\n', '# RUN_REGRESSION_TESTS=0 skips the post-build regression suite.\n# RUNTIME_ONLY=1 only provisions runtime config and runs verification/tests.\n', 'usage')
          once('ENABLE_LEGACY_PROVIDER="${ENABLE_LEGACY_PROVIDER:-1}"\n', 'ENABLE_LEGACY_PROVIDER="${ENABLE_LEGACY_PROVIDER:-1}"\nRUNTIME_ONLY="${RUNTIME_ONLY:-0}"\n', 'variable')
          once('main() {\n  need_root\n  mkdir -p "$BUILD_ROOT" "$NGM_ROOT"\n\n  log "building PHP ${PHP_RELEASE} -> ${PREFIX} (jobs=${JOBS})"', 'main() {\n  need_root\n  mkdir -p "$BUILD_ROOT" "$NGM_ROOT"\n\n  if [ "$RUNTIME_ONLY" = "1" ]; then\n    log "runtime-only provisioning / verification for PHP ${PHP_RELEASE} at ${PREFIX}"\n    [ -x "${PREFIX}/bin/php" ] || die "existing PHP CLI binary missing: ${PREFIX}/bin/php"\n    [ -x "${PREFIX}/sbin/php-fpm" ] || die "existing PHP FPM binary missing: ${PREFIX}/sbin/php-fpm"\n    find_libdir "$OPENSSL_PREFIX" \'libssl.so.3\' >/dev/null || die "private OpenSSL 3 runtime missing under ${OPENSSL_PREFIX}."\n    provision_openssl_runtime_files\n    verify\n    run_regression_tests\n    return\n  fi\n\n  log "building PHP ${PHP_RELEASE} -> ${PREFIX} (jobs=${JOBS})"', 'runtime-only branch')
          p.write_text(t, encoding='utf-8')
          PY
          bash -n build-php53.sh
          git diff --check
          test "$(git diff --name-only)" = "build-php53.sh"
      - name: Commit
        shell: bash
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add build-php53.sh
          git commit -m "Add runtime-only PHP 5.3 verification mode"
          git push origin HEAD:main
