name: Port PHP 5.3 production builder to OpenSSL 3.5

on:
  push:
    paths:
      - .github/workflows/port-production-build-openssl35.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update production builder
        shell: bash
        run: |
          python3 .github/port-production-build-openssl35.py
          bash -n build-php53.sh
          git diff --check
          test "$(git diff --name-only)" = "build-php53.sh"
          grep -Fq 'OPENSSL_VERSION="${OPENSSL_VERSION:-3.5.7}"' build-php53.sh
          grep -Fq 'OPENSSL_PREFIX="${OPENSSL_PREFIX:-${NGM_ROOT}/openssl-3.5}"' build-php53.sh
          grep -Fq 'libssl.so.3' build-php53.sh
          ! grep -Fq 'libssl.so.1.1' build-php53.sh
          ! grep -Fq '/openssl-1.1' build-php53.sh

      - name: Commit production builder port
        shell: bash
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add build-php53.sh
          git commit -m "Port PHP 5.3 production build to OpenSSL 3.5"
          git push origin HEAD:main
