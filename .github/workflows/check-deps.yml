# Weekly dependency check: runs tools/check-deps.py --bump and, when anything
# this builder pins is behind upstream (OpenSSL LTS, curl, Snuffleupagus, the
# CloudLinux SRPM series), opens a PR with the rewritten pins / re-imported
# patches. Detection is automatic, adoption is not: a human reviews the PR,
# host-builds and merges. Re-runs force-push the same branch, so there is at
# most one open PR, always against the latest default branch.
#
# Needs: Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests".
name: check-deps

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-deps
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check pinned dependencies
        id: check
        run: |
          set +e
          python3 tools/check-deps.py --bump --summary "$RUNNER_TEMP/deps.md"
          rc=$?
          set -e
          [ -f "$RUNNER_TEMP/deps.md" ] && cat "$RUNNER_TEMP/deps.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = current, 3 = behind (bumped), anything else = the check itself broke
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi

      - name: Open or update the PR
        if: steps.check.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: deps/auto-update
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "behind, but --bump changed nothing (see the summary)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -F - <<EOF
          deps: automated pin update

          $(cat "$RUNNER_TEMP/deps.md")
          EOF
          git push -f origin "$BRANCH"
          state="$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || true)"
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/deps.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "deps: automated pin update" --body-file "$RUNNER_TEMP/deps.md"
          fi
