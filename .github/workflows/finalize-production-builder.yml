name: Finalize PHP 5.3 production builder

on:
  push:
    paths:
      - .github/workflows/finalize-production-builder.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize builder
        shell: bash
        run: |
          python3 .github/finalize-production-builder.py
          bash -n build-php53.sh
          git diff --check
          test "$(git diff --name-only)" = "build-php53.sh"
          grep -Fq 'RUN_REGRESSION_TESTS="${RUN_REGRESSION_TESTS:-1}"' build-php53.sh
          grep -Fq 'ENABLE_LEGACY_PROVIDER="${ENABLE_LEGACY_PROVIDER:-1}"' build-php53.sh
          grep -Fq '# BEGIN NGM OPENSSL35 LEGACY PROVIDER' build-php53.sh
          grep -Fq 'run_regression_tests' build-php53.sh

      - name: Commit builder finalization
        shell: bash
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add build-php53.sh
          test "$(git diff --cached --name-only)" = "build-php53.sh"
          git commit -m "Make PHP 5.3 production build self-validating"
          git push origin HEAD:main
